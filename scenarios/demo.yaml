# Demo scenario: train on the rail (should be explained away), a drone among the blocks,
# a fan that sounds like a drone, a jam zone over two drones, and one drone with a stuck
# bearing sensor. Sound power levels: earshot/sensors/acoustics.py SOUND_POWER.
name: demo
seed: 42
city: data/cities/synthetic.json
duration: 300
dt: 0.1

drones:            # home = centre of the initial patrol sector
  - {id: 0, x: -600, y: -600, home: [-600, -600]}
  - {id: 1, x:    0, y: -600, home: [0, -600]}
  - {id: 2, x:  600, y: -600, home: [600, -600]}
  - {id: 3, x: -600, y:  200, home: [-600, 200]}
  - {id: 4, x:    0, y:  200, home: [0, 200]}
  - {id: 5, x:  600, y:  200, home: [600, 200]}

environment:
  background_db: 40     # night; day is 50-60
  ego_filter: true
  ego_filter_db: 8

sources:           # rf: list of bands from earshot/sensors/rf.py BANDS (2g4, 5g8, 915)
  - {id: train1, cls: train,    start: 20,  end: 80,  level_db: 120, path: [[-1000, 820], [0, 760], [1000, 840]]}
  - {id: truck1, cls: vehicle,  start: 40,  end: 160, level_db: 105, path: [[-1000, -40], [1000, -40]]}
  - {id: drone1, cls: drone,    start: 90,  end: 260, level_db: 82,  rf: [2g4], path: [[150, -350], [250, -250], [100, -150]]}
  - {id: fan1,   cls: nuisance, start: 0,   end: 300, level_db: 75,  path: [[470, -40]]}  # near drone 5's roof p5_3

jamming:
  - {start: 150, end: 190, center: [-600, -600], radius: 350}

faults:
  - {drone: 3, start: 200, kind: stuck_bearing}

radio:             # see earshot/radio/medium.py RadioConfig
  sf: 7
  bw_khz: 500
  nominal_range_m: 700
