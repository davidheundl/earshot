[project]
name = "earshot"
version = "0.1.0"
description = "Listening swarm: perching drones fuse sound and RF into a shared threat map"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "pyzmq>=26",
    "msgpack>=1.0",
    "shapely>=2.0",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pillow>=12.3.0",
    "cma>=4.5.0",
]

[project.scripts]
earshot = "earshot.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
# Camera detector (YOLO, tools/cv_demos.py, earshot.vision): `uv sync --group cv`.
cv = ["ultralytics>=8.3", "lap>=0.5.12"]
# Live microphone arrays in the room (concept section 10). Nikolas' area.
audio = ["sounddevice>=0.4", "pyroomacoustics>=0.7"]
# Building cities from open data (tools/muc_fetch.py, tools/make_muc.py); not needed at runtime.
data = ["pyproj>=3.6"]
# Sound classifier (src/earshot/audio/classifier.py, tools/*sound*): EfficientAT on the CPU.
# Not a default group: the swarm runs without torch. `uv sync --group ml` to add it.
ml = ["torch>=2.5,<2.10", "torchvision>=0.20,<0.25", "soundfile>=0.12", "pyarrow>=15"]
# Offline visual localization and depth (tools/cv_navigation.py), on top of `cv`.
cv-navigation = [
    "transformers>=4.45,<5",
]

[tool.uv]
default-groups = ["dev", "audio", "data"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earshot"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/earshot/audio/efficientat/model.py",
                  "src/earshot/audio/efficientat/block_types.py",
                  "src/earshot/audio/efficientat/attention_pooling.py",
                  "src/earshot/audio/efficientat/utils.py"]  # vendored as-is

[tool.pytest.ini_options]
testpaths = ["tests"]
